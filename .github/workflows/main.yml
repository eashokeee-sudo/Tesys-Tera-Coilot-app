name: Build TeSys Tera Lab APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Finds settings.gradle.kts even if the project was uploaded inside a sub-folder,
      # and stops with a clear message if it is missing.
      - name: Locate Gradle project
        id: loc
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found in the repository. Upload the CONTENTS of the TeSysTeraLab folder (not the zip)."
            echo "Repository layout:"; find . -not -path "./.git/*" -maxdepth 3 | head -60
            exit 1
          fi
          D=$(dirname "$F")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Project found in: $D"; ls -la "$D"; ls -la "$D/app" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # Prints only the useful part of a failed log (the stack trace is not needed).
      - name: Show the actual error
        if: failure()
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          echo "===== WHAT WENT WRONG ====="
          grep -n -B2 -A14 -E "What went wrong|^e: |error:|FAILURE" build.log | head -120 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeSysTeraLab-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Unit tests
        if: success()
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle testDebugUnitTest --no-daemon --console=plain
